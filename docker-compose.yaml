services:
  tavo:
    image: ghcr.io/jukaza/tavo:latest
    ports:
      - "8080:8080"
    volumes:
      - ./tavo.yaml:/etc/tavo/tavo.yaml:ro
      - ./tavo.license.jwt:/etc/tavo/tavo.license.jwt:ro
      - tavo_data:/data
    environment:
      - TAVO_ADMIN_KEY=${TAVO_ADMIN_KEY}
      - TAVO_ENCRYPTION_KEY=${TAVO_ENCRYPTION_KEY}
    restart: unless-stopped

volumes:
  tavo_data:

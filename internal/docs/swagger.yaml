basePath: /api/v1
definitions:
  admin.apiKeyResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      daily_token_limit:
        type: integer
      expires_at:
        type: string
      id:
        type: string
      key_hint:
        type: string
      key_type:
        type: string
      last_used_at:
        type: string
      monthly_token_limit:
        type: integer
      name:
        type: string
      requests_per_day:
        type: integer
      requests_per_minute:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  admin.availableModel:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  admin.availableModelsResponse:
    properties:
      models:
        items:
          $ref: '#/definitions/admin.availableModel'
        type: array
    type: object
  admin.changeOwnPasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  admin.createAPIKeyRequest:
    properties:
      daily_token_limit:
        type: integer
      expires_at:
        type: string
      key_type:
        type: string
      monthly_token_limit:
        type: integer
      name:
        type: string
      requests_per_day:
        type: integer
      requests_per_minute:
        type: integer
      user_id:
        type: string
    type: object
  admin.createAPIKeyResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      daily_token_limit:
        type: integer
      expires_at:
        type: string
      id:
        type: string
      key:
        type: string
      key_hint:
        type: string
      key_type:
        type: string
      monthly_token_limit:
        type: integer
      name:
        type: string
      requests_per_day:
        type: integer
      requests_per_minute:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  admin.createDeploymentRequest:
    properties:
      api_key:
        type: string
      azure_api_version:
        type: string
      azure_deployment:
        type: string
      base_url:
        type: string
      cost_cache_write_per_1m:
        type: number
      cost_cached_input_per_1m:
        type: number
      cost_input_per_1m:
        description: Cost prices in USD per 1M tokens. Nil = fall back to model-level
          pricing.
        type: number
      cost_output_per_1m:
        type: number
      daily_request_limit:
        type: integer
      gcp_location:
        description: GCPLocation is the Google Cloud region (e.g. "us-central1").
          Required when provider is "vertex".
        type: string
      gcp_project:
        description: GCPProject is the Google Cloud project ID. Required when provider
          is "vertex".
        type: string
      name:
        type: string
      pii_filter:
        description: |-
          PIIFilter explicitly enables or disables PII anonymization for requests
          routed to this deployment. Omit to inherit from the model or network default.
        type: boolean
      priority:
        type: integer
      provider:
        type: string
      provider_id:
        description: ProviderID links this route to a provider (partner/source).
        type: string
      rpm_limit:
        type: integer
      tpm_limit:
        type: integer
      upstream_model:
        description: |-
          UpstreamModel is the model name sent upstream. Empty = use the model's
          canonical name. Non-empty enables cross-model routes.
        type: string
      weight:
        type: integer
    type: object
  admin.createModelRequest:
    properties:
      aliases:
        description: Aliases are optional short names that resolve to this model in
          proxy requests.
        items:
          type: string
        type: array
      api_key:
        type: string
      azure_api_version:
        type: string
      azure_deployment:
        type: string
      base_url:
        type: string
      bill_min_per_request:
        type: boolean
      bill_per_request:
        type: boolean
      bill_per_token:
        type: boolean
      fallback_model_name:
        description: |-
          FallbackModelName is the name of the model to try if all deployments of
          this model are unavailable. Requires an Enterprise license with the
          fallback_chains feature. Leave empty to disable fallback.
        type: string
      gcp_location:
        description: GCPLocation is the Google Cloud region (e.g. "us-central1").
          Required when provider is "vertex".
        type: string
      gcp_project:
        description: GCPProject is the Google Cloud project ID. Required when provider
          is "vertex".
        type: string
      input_price_per_1m:
        type: number
      is_public:
        description: IsPublic marks the model as visible on the public storefront
          price list.
        type: boolean
      logo:
        description: Logo is the customer-facing logo URL or asset path.
        type: string
      max_context_tokens:
        type: integer
      max_retries:
        description: |-
          MaxRetries is the maximum number of deployments to attempt before returning
          an error. 0 means try all available deployments.
        type: integer
      name:
        type: string
      output_price_per_1m:
        type: number
      pii_filter:
        description: |-
          PIIFilter explicitly enables or disables PII anonymization for requests
          routed to this model. When omitted the network-level default is used.
          Pass true to force anonymization on, false to force it off.
        type: boolean
      provider:
        type: string
      rpm_limit:
        type: integer
      sell_cached_input_per_1m:
        type: number
      sell_input_per_1m:
        description: |-
          SellInputPer1M / SellOutputPer1M / SellCachedInputPer1M are the
          customer-facing prices in USD per 1M tokens. Omit to leave the model
          unbilled (requests do not debit wallets).
        type: number
      sell_min_per_request:
        type: number
      sell_output_per_1m:
        type: number
      sell_per_request:
        type: number
      strategy:
        description: |-
          Strategy is the load balancing strategy used when multiple deployments are
          configured. Valid values: "round-robin", "weighted", "priority". Omit or
          pass an empty string for single-deployment (legacy) mode.
        type: string
      timeout:
        description: |-
          Timeout is the per-model upstream timeout as a Go duration string (e.g. "30s",
          "2m"). When non-empty it overrides the global stream/response timeout for
          this model. Omit or pass an empty string to use the global default.
        type: string
      type:
        type: string
    type: object
  admin.deploymentResponse:
    properties:
      azure_api_version:
        type: string
      azure_deployment:
        type: string
      base_url:
        type: string
      cost_cache_write_per_1m:
        type: number
      cost_cached_input_per_1m:
        type: number
      cost_input_per_1m:
        type: number
      cost_output_per_1m:
        type: number
      created_at:
        type: string
      daily_request_limit:
        type: integer
      gcp_location:
        description: GCPLocation is the Google Cloud region. Non-empty only for provider
          "vertex".
        type: string
      gcp_project:
        description: GCPProject is the Google Cloud project ID. Non-empty only for
          provider "vertex".
        type: string
      id:
        type: string
      is_active:
        type: boolean
      model_id:
        type: string
      name:
        type: string
      pii_filter:
        description: |-
          PIIFilter is the per-deployment PII anonymization override. Nil means
          inherit from the model-level or network-level default; true forces
          anonymization on; false forces it off.
        type: boolean
      priority:
        type: integer
      provider:
        type: string
      provider_id:
        type: string
      rpm_limit:
        type: integer
      tpm_limit:
        type: integer
      updated_at:
        type: string
      upstream_model:
        description: |-
          UpstreamModel is the model name sent upstream; empty means the
          canonical model name is used.
        type: string
      weight:
        type: integer
    type: object
  admin.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  admin.loginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/admin.meResponse'
    type: object
  admin.meResponse:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      is_system_admin:
        type: boolean
      role:
        type: string
    type: object
  admin.modelResponse:
    properties:
      aliases:
        items:
          type: string
        type: array
      azure_api_version:
        type: string
      azure_deployment:
        type: string
      base_url:
        type: string
      bill_min_per_request:
        type: boolean
      bill_per_request:
        type: boolean
      bill_per_token:
        type: boolean
      created_at:
        type: string
      deployments:
        description: Deployments contains the model's deployment entries when present.
        items:
          $ref: '#/definitions/admin.deploymentResponse'
        type: array
      fallback_model_name:
        description: |-
          FallbackModelName is the name of the fallback model, or empty when none
          is configured.
        type: string
      gcp_location:
        description: GCPLocation is the Google Cloud region. Non-empty only for provider
          "vertex".
        type: string
      gcp_project:
        description: GCPProject is the Google Cloud project ID. Non-empty only for
          provider "vertex".
        type: string
      id:
        type: string
      input_price_per_1m:
        type: number
      is_active:
        type: boolean
      is_public:
        description: IsPublic marks the model as visible on the public storefront
          price list.
        type: boolean
      logo:
        description: Logo is the customer-facing logo URL or asset path.
        type: string
      max_context_tokens:
        type: integer
      max_retries:
        description: |-
          MaxRetries is the maximum number of deployments to attempt before
          returning an error. 0 means try all available deployments.
        type: integer
      name:
        type: string
      output_price_per_1m:
        type: number
      pii_filter:
        description: |-
          PIIFilter is the per-model PII anonymization override. Nil means the
          network-level default is used; true forces anonymization on; false off.
        type: boolean
      provider:
        type: string
      route_count:
        description: RouteCount is the number of enabled combo route steps (API products
          only).
        type: integer
      routing_strategy:
        type: string
      rpm_limit:
        type: integer
      sell_cached_input_per_1m:
        type: number
      sell_input_per_1m:
        description: Sell prices are the customer-facing prices per 1M tokens.
        type: number
      sell_min_per_request:
        type: number
      sell_output_per_1m:
        type: number
      sell_per_request:
        type: number
      source:
        type: string
      sticky_round_robin_limit:
        type: integer
      strategy:
        description: |-
          Strategy is the load balancing strategy used when multiple deployments
          are configured (e.g. "round-robin", "weighted", "priority"). An empty
          string means single-deployment (legacy) mode.
        type: string
      timeout:
        description: |-
          Timeout is the per-model upstream timeout (e.g. "30s", "2m").
          An empty string means the global default is used.
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  admin.paginatedModelsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/admin.modelResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  admin.registerResponse:
    properties:
      api_key:
        type: string
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/admin.meResponse'
    type: object
  admin.swaggerErrorResponse:
    properties:
      error:
        $ref: '#/definitions/apierror.SwaggerDetail'
    type: object
  admin.testConnectionRequest:
    properties:
      api_key:
        type: string
      base_url:
        type: string
      provider:
        type: string
    type: object
  admin.testConnectionResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  admin.updateDeploymentRequest:
    properties:
      api_key:
        type: string
      azure_api_version:
        type: string
      azure_deployment:
        type: string
      base_url:
        type: string
      cost_cache_write_per_1m:
        type: number
      cost_cached_input_per_1m:
        type: number
      cost_input_per_1m:
        type: number
      cost_output_per_1m:
        type: number
      daily_request_limit:
        type: integer
      gcp_location:
        description: GCPLocation, when non-nil, replaces the stored Google Cloud region.
        type: string
      gcp_project:
        description: GCPProject, when non-nil, replaces the stored Google Cloud project
          ID.
        type: string
      name:
        type: string
      pii_filter:
        description: |-
          PIIFilter, when non-nil, replaces the PII anonymization override for
          this deployment. Pass true to force anonymization on, false to force it off.
          Omit the field entirely to leave the existing setting unchanged.
        type: boolean
      priority:
        type: integer
      provider:
        type: string
      provider_id:
        description: ProviderID, when non-nil, replaces the linked provider. Pass
          "" to clear.
        type: string
      rpm_limit:
        type: integer
      tpm_limit:
        type: integer
      upstream_model:
        description: |-
          UpstreamModel, when non-nil, replaces the upstream model name. Pass ""
          to revert to the canonical model name.
        type: string
      weight:
        type: integer
    type: object
  admin.updateModelRequest:
    properties:
      aliases:
        description: |-
          Aliases, when non-nil, replaces the full set of aliases for the model.
          Pass an empty slice to remove all aliases.
        items:
          type: string
        type: array
      api_key:
        type: string
      azure_api_version:
        type: string
      azure_deployment:
        type: string
      base_url:
        type: string
      bill_min_per_request:
        type: boolean
      bill_per_request:
        type: boolean
      bill_per_token:
        type: boolean
      fallback_model_name:
        description: |-
          FallbackModelName, when non-nil, replaces the fallback model. Pass a
          pointer to an empty string to clear the fallback. Requires Enterprise
          license with the fallback_chains feature when setting a non-empty value.
        type: string
      gcp_location:
        description: GCPLocation, when non-nil, replaces the Google Cloud region.
        type: string
      gcp_project:
        description: GCPProject, when non-nil, replaces the Google Cloud project ID.
        type: string
      input_price_per_1m:
        type: number
      is_public:
        description: IsPublic, when non-nil, replaces the storefront visibility flag.
        type: boolean
      logo:
        description: Logo, when non-nil, replaces the customer-facing logo. Pass ""
          to clear.
        type: string
      max_context_tokens:
        type: integer
      max_retries:
        description: MaxRetries, when non-nil, replaces the maximum deployment retry
          count.
        type: integer
      name:
        type: string
      output_price_per_1m:
        type: number
      pii_filter:
        description: |-
          PIIFilter, when non-nil, replaces the PII anonymization override for this
          model. Pass true to force anonymization on, false to force it off, or
          omit the field entirely to leave the existing setting unchanged.
          Send the JSON key with a null value to clear the override and revert to
          the network-level default (NULL in the DB).
        type: boolean
      provider:
        type: string
      routing_strategy:
        type: string
      rpm_limit:
        type: integer
      sell_cached_input_per_1m:
        type: number
      sell_input_per_1m:
        description: Sell prices, when non-nil, replace the customer-facing prices.
        type: number
      sell_min_per_request:
        type: number
      sell_output_per_1m:
        type: number
      sell_per_request:
        type: number
      sticky_round_robin_limit:
        type: integer
      strategy:
        description: |-
          Strategy, when non-nil, replaces the load balancing strategy. Pass a
          pointer to an empty string to revert to single-deployment mode.
        type: string
      timeout:
        description: |-
          Timeout, when non-nil, replaces the per-model timeout. Pass a pointer to
          an empty string to clear the timeout and revert to the global default.
        type: string
      type:
        type: string
    type: object
  apierror.SwaggerDetail:
    properties:
      code:
        example: not_found
        type: string
      message:
        example: resource not found
        type: string
    type: object
info:
  contact: {}
  description: Prepaid LLM API marketplace with OpenAI-compatible proxy, wallet billing,
    and model catalog.
  title: VoidLLM API
  version: 0.2.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies credentials and returns a 24-hour session token. Revokes
        any existing session for the user.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.loginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
      summary: Authenticate with email and password
      tags:
      - auth
  /auth/providers:
    get:
      description: Returns which login methods are enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: List available authentication providers
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a customer account with a personal org, prepaid wallet,
        and first API key.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.registerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
      summary: Public customer signup
      tags:
      - auth
  /keys:
    post:
      consumes:
      - application/json
      description: Creates a new API key. Members may only create user keys for themselves.
        The plaintext key is returned exactly once.
      parameters:
      - description: API key parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.createAPIKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an API key
      tags:
      - keys
  /keys/{key_id}:
    get:
      description: Returns a single API key scoped by role.
      parameters:
      - description: API key ID
        in: path
        name: key_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.apiKeyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an API key
      tags:
      - keys
  /me:
    get:
      description: Returns the profile of the user associated with the current session
        key.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.meResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - auth
  /me/available-models:
    get:
      description: Returns models accessible to the caller's org, team, and key scope.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.availableModelsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: List models available to the authenticated key
      tags:
      - auth
  /me/password:
    post:
      consumes:
      - application/json
      description: Verifies the current password and sets a new one. Revokes all other
        active sessions. Requires a user-scoped session key.
      parameters:
      - description: Password change request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.changeOwnPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Change own password
      tags:
      - auth
  /models:
    get:
      description: Returns a cursor-paginated list of models. Requires system admin.
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor (UUIDv7 of the last seen model)
        in: query
        name: cursor
        type: string
      - description: Include inactive models
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.paginatedModelsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: List models
      tags:
      - models
    post:
      consumes:
      - application/json
      description: Persists a new model and adds it to the live registry. The API
        key is encrypted at rest. Requires system admin.
      parameters:
      - description: Model parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.createModelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.modelResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/admin.swaggerErrorResponse'

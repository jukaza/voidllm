server:
  proxy:
    port: 8080
    read_timeout: 30s
    write_timeout: 120s
    idle_timeout: 60s
  admin:
    port: 0

database:
  driver: sqlite
  dsn: /root/tavo/data/tavo.db

settings:
  admin_key: ${TAVO_ADMIN_KEY}
  encryption_key: ${TAVO_ENCRYPTION_KEY}
  wallet:
    enforce_balance: false

logging:
  level: info
  format: json
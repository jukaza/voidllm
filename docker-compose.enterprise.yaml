services:
  tavo:
    image: ghcr.io/jukaza/tavo:latest
    ports:
      - "8080:8080"
    volumes:
      - ./tavo.yaml:/etc/tavo/tavo.yaml:ro
      - ./tavo.license.jwt:/etc/tavo/tavo.license.jwt:ro
    environment:
      - TAVO_ADMIN_KEY=${TAVO_ADMIN_KEY}
      - TAVO_ENCRYPTION_KEY=${TAVO_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tavo
      POSTGRES_USER: tavo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
